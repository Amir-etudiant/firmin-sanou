# Configuration Netlify pour le site de Firmin Sanou
# Documentation : https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Pas de build step nécessaire — c'est un site statique pur
  publish = "."

# Redirection : /admin → /admin/ (avec slash)
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# Headers pour de meilleures performances
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60"

# Sécurité minimum
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
